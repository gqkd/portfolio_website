# Netlify HTML post-processing ("Pretty URLs") rewrites every <a> whose href ends in
# .html and strips the inline style / style-hover attributes off those links. That is
# what un-styled the nav "05 blog" item and the "ALL POSTS" button on the live site.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# Keep the extension-less URLs pretty_urls used to serve.
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/post"
  to = "/post.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://thebiomedicalgeek.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
